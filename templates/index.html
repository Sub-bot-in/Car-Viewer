<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HiveCars</title>
        <link rel="stylesheet" href="/static/css/style.css" />
    </head>
    <body>
        <header class="hero">
            <h1><a href="/">Hive Car</a></h1>
            <p>Explore vehicles from our collection</p>
        </header>

        <form method="GET" class="filters">
            <select name="manufacturer">
                <option value="">All manufacturers</option>
                {{range .Manufacturers}}
                <option
                    value="{{.Name}}"
                    {{if
                    eq
                    $.SelectedManufacturer
                    .Name}}selected{{end}}
                >
                    {{.Name}}
                </option>
                {{end}}
            </select>

            <select name="category">
                <option value="">All categories</option>
                {{range .Categories}}
                <option
                    value="{{.Name}}"
                    {{if
                    eq
                    $.SelectedCategory
                    .Name}}selected{{end}}
                >
                    {{.Name}}
                </option>
                {{end}}
            </select>

            <select name="year">
                <option value="">All years</option>
                {{range .Years}}
                <option value="{{.}}" {{if eq $.SelectedYear .}}selected{{end}}>
                    {{.}}
                </option>
                {{end}}
            </select>

            <button type="submit">Filter</button>
        </form>

        <main class="container">
            <div class="car-grid">
                {{$root := .}} {{range .Cars}}
                <article class="car-card">
                    <a
                        href="/specifications/{{.ID}}?page={{$root.Page}}&manufacturer={{$root.SelectedManufacturer}}&category={{$root.SelectedCategory}}&year={{$root.SelectedYear}}"
                        class="card-link"
                    >
                        <div class="image-container">
                            <img
                                src="http://localhost:3000/api/images/{{.Image}}"
                                alt="{{.Name}}"
                            />
                        </div>

                        <div class="car-info">
                            <h3>{{.Name}}</h3>
                            <span class="year">{{.Year}}</span>

                            <a class="compare-btn" href="/compare/add/{{.ID}}">
                                Compare
                            </a>
                        </div>
                    </a>
                </article>
                {{end}}
            </div>

            <div class="pagination">
                {{range $root.Pages}} {{if .IsDots}}
                <span class="dots">...</span>
                {{else}} {{if eq .Number $root.Page}}
                <span class="page-number active-page">{{.Number}}</span>
                {{else}}
                <a
                    class="page-number"
                    href="/?page={{.Number}}&manufacturer={{$root.SelectedManufacturer}}&category={{$root.SelectedCategory}}&year={{$root.SelectedYear}}"
                >
                    {{.Number}}</a
                >
                {{end}} {{end}} {{end}}
            </div>
        </main>
    </body>
</html>
