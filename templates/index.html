<!doctype html>
<html>
    </head>
    <body>
        <h1>Welcome to HiveCars</h1>

        {{range .Cars}}
        <div class="car-grid">
          <div class="car-card">
            <div class="image-container">
              <img src="http://localhost:3000/api/images/{{.Image}}" width="400" alt="{{.Name}}">
            <div class="car-info">
              <h3>{{.Name}}</h3>
              <span>{{.Year}}</span>
            </div>
          </div>


        {{end}}
    </body>
    </html>
