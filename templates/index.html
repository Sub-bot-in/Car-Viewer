<!doctype html>
<html>
    </head>
    <body>
        <h1>Welcome to HiveCars</h1>

        {{range .Cars}}
        <div class="car-grid">
          <div class="car-card">
            <div class="image-container">
            <a href="http://localhost:8080/specifications/{{.ID}}">
              <img src="http://localhost:3000/api/images/{{.Image}}" width="400" alt="{{.Name}}">

            <div class="car-info">
                <a href="http://localhost:8080/specifications/{{.ID}}">
              <h3>{{.Name}}</h3>
              <span>{{.Year}}</span>
                </a>
            </div>
          </div>


        {{end}}

        <div class="pagination">
            {{if .HasPrev}}
                <a href="/?page={{.PrevPage}}">Previous</a>
            {{end}}

            {{range .Pages}}
                <a href="/?page={{.}}">{{.}}</a>
            {{end}}

            {{if .HasNext}}
                <a href="/?page={{.NextPage}}">Next</a>
            {{end}}
        </div>

    </body>
    </html>
